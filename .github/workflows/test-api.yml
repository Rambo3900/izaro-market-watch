name: Izaro API Test

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'  # jede Stunde um Minute 17 (UTC)

jobs:
  test-api:
    runs-on: ubuntu-latest

    steps:
      - name: Poe ninja Challenge League API testen
        run: |
          python - <<'PY'
          import json
          import sys
          import urllib.request
          from urllib.parse import urlencode

          BASE = "https://poe.ninja/poe1/api"

          def fetch(url):
              req = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "IzaroMarketWatch/0.2 (https://github.com/Rambo3900/izaro-market-watch)",
                      "Accept": "application/json",
                  },
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)

          print("=== IZARO MARKET WATCH ===", flush=True)
          leagues = fetch(BASE + "/economy/leagues")
          ids = [league["id"] for league in leagues]
          print("Verfuegbare Ligen:", ", ".join(ids), flush=True)

          # poe.ninja documents that the first entry is the current challenge league.
          # Before launch the API can return only Standard and Hardcore.
          if not ids or ids[0] in {"Standard", "Hardcore"}:
              print("Challenge-Liga noch nicht verfuegbar. Ueberspringe diesen Lauf.")
              sys.exit(0)

          league = ids[0]
          print("Challenge-Liga:", league, flush=True)
          params = urlencode({"league": league, "type": "SkillGem"})
          url = BASE + "/economy/stash/current/item/overview?" + params
          data = fetch(url)
          lines = data.get("lines", [])
          if not lines:
              print("Noch keine Gem-Preise verfuegbar. Ueberspringe diesen Lauf.")
              sys.exit(0)

          # First-pass filter, deliberately not a definitive transfigured-gem catalog.
          # Ignore Vaal variants and high-level/high-quality listings for now.
          transfigured = []
          for gem in lines:
              name = gem.get("name", "")
              if " of " not in name or name.startswith("Vaal "):
                  continue
              level = gem.get("gemLevel")
              quality = gem.get("gemQuality")
              if isinstance(level, (int, float)) and level >= 20:
                  continue
              if isinstance(quality, (int, float)) and quality >= 20:
                  continue
              transfigured.append(gem)

          print("Skill-Gem-Preiszeilen:", len(lines))
          print("Transfigured-Kandidaten (Preiszeilen):", len(transfigured))
          print("Beispiele:")
          for gem in transfigured[:10]:
              print(
                  gem.get("name"),
                  "Preis:", gem.get("chaosValue"),
                  "Chaos | Level:", gem.get("gemLevel"),
                  "| Qualitaet:", gem.get("gemQuality"),
              )
          print("CHALLENGE-LEAGUE-API-TEST ERFOLGREICH!")
          PY
