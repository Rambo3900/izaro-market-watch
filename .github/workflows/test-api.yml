
name: Izaro API Test

on:
  workflow_dispatch:

jobs:
  test-api:
    runs-on: ubuntu-latest

    steps:
      - name: Poe ninja API testen
        run: |
          python - <<'PY'
          import json
          import urllib.request
          from urllib.parse import urlencode

          BASE = "https://poe.ninja/poe1/api"

          def fetch(url):
              req = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "IzaroMarketWatch/0.1 (https://github.com/Rambo3900/izaro-market-watch)",
                      "Accept": "application/json",
                  },
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)

          print("=== IZARO MARKET WATCH ===")

          leagues = fetch(BASE + "/economy/leagues")
          print("Verfuegbare Ligen:")
          for league in leagues:
              print("-", league["id"])

          league = leagues[0]["id"]
          print("Aktuelle Challenge-Liga:", league)

          params = urlencode({
              "league": league,
              "type": "SkillGem",
          })

          url = BASE + "/economy/stash/current/item/overview?" + params
          data = fetch(url)

          lines = data["lines"]
          transfigured = [
              gem for gem in lines
              if " of " in gem.get("name", "")
          ]

          print("Skill-Gem-Preise:", len(lines))
          print("Transfigured-Gem-Preiszeilen:", len(transfigured))

          print("Beispiele:")
          for gem in transfigured[:5]:
              print(
                  gem["name"],
                  gem.get("chaosValue"),
                  "chaos",
                  "Level:", gem.get("gemLevel"),
                  "Qualitaet:", gem.get("gemQuality"),
              )

          print("API-TEST ERFOLGREICH!")
          PY
