name: Izaro Market Watch

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/test-api.yml'
  schedule:
    - cron: '17 * * * *'  # hourly, UTC; manual run still available

permissions:
  contents: write

concurrency:
  group: izaro-market-watch
  cancel-in-progress: false

jobs:
  market-watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Run offline regression tests
        run: python3 -m unittest discover -s tests -v

      - name: Refresh RePoE gem-color catalog
        run: |
          python3 - <<'PY'
          from datetime import datetime, timezone
          from scripts.market_watch import get_catalog
          gems = get_catalog(datetime.now(timezone.utc))
          print("Verified RePoE gem colors:", len(gems))
          PY

      - name: Fetch league and gem market
        run: python3 scripts/market_watch.py

      - name: Persist public market history
        run: |
          if [ ! -d data ]; then
            echo "No challenge-league data yet; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changed market data."
          else
            git commit -m "data: update poe1 transfigured gem market [skip ci]"
            git push origin HEAD:main
          fi
